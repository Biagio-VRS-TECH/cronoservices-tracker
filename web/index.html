<!doctype html>
<html lang="it" data-tema="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="theme-color" content="#f4f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<title>Crono Mappature · VRS</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icona.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icona-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonti/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonti/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonti.css">
<link rel="stylesheet" href="/css/vrs-famiglia.css">
<link rel="stylesheet" href="/css/vrs-app.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/griglia.css">
<link rel="stylesheet" href="/css/stat.css">
<link rel="stylesheet" href="/css/stampa.css">
<!-- PERF-14: i moduli di app.js si scaricano tutti insieme, non uno dopo l'altro
     man mano che il browser scopre gli import (senza bundler). L'elenco lo
     controlla tests/js/web-precarico.test.mjs: un import nuovo va aggiunto qui. -->
<link rel="modulepreload" href="/js/app.js">
<link rel="modulepreload" href="/js/ui.js">
<link rel="modulepreload" href="/js/api.js">
<link rel="modulepreload" href="/js/nuvola.js">
<link rel="modulepreload" href="/js/nuvola-config.js">
<link rel="modulepreload" href="/js/stato.js">
<link rel="modulepreload" href="/js/affinita.js">
<link rel="modulepreload" href="/js/documenti.js">
<link rel="modulepreload" href="/js/cassetto.js">
<link rel="modulepreload" href="/js/spunte.js">
<link rel="modulepreload" href="/js/anno.js">
<link rel="modulepreload" href="/js/mese.js">
<link rel="modulepreload" href="/js/stat.js">
<link rel="modulepreload" href="/js/famiglia.js">
<link rel="modulepreload" href="/js/condividi.js">
<link rel="modulepreload" href="/js/vrs-icone.js">
</head>
<body>
<a class="skip-link" href="#area">Salta al contenuto</a>
<div class="guscio">

  <div class="banner" id="banner" hidden></div>

  <header class="testa">
    <!-- VIS-05 / PRD-01: il marchio e' anche il selettore d'app (Planning ·
         CronoService · Scheduler), lo stesso del Planning (#ANCHOR: famiglia in
         js/famiglia.js). VIS-04: qui la tessera dell'app, come la «P» del
         Planning; il logo VRS sta nella finestrella, grande abbastanza da
         leggerlo. -->
    <button type="button" class="marca vrs-app-btn" id="app-scelta"
            aria-haspopup="dialog" aria-expanded="false"
            aria-label="Crono Mappature, cambia app" title="Passa al Planning o allo Scheduler">
      <img src="/assets/icona.svg" alt="" width="28" height="28"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'segno-logo'}))">
      <span class="marca-testo">
        <b>Crono Mappature</b>
        <span>Checklist service</span>
      </span>
      <svg class="vrs-app-giu" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <div class="anno-scelta">
      <button class="frecc" id="anno-giu" title="Anno precedente" aria-label="Anno precedente"></button>
      <span class="anno dato" id="anno" aria-live="polite">····</span>
      <button class="frecc" id="anno-su" title="Anno successivo" aria-label="Anno successivo"></button>
      <button class="pill mini" id="oggi" title="Torna all'anno e al mese correnti">Oggi</button>
    </div>

    <span class="testa-spazio"></span>

    <div class="cerca">
      <span class="cerca-ico" id="cerca-ico" aria-hidden="true"></span>
      <input id="q" type="search" placeholder="Cliente, destinazione o #id…" aria-label="Cerca cliente, destinazione o numero"
             autocomplete="off" spellcheck="false">
      <button class="cerca-x" id="cerca-x" title="Svuota la ricerca" aria-label="Svuota la ricerca" hidden>&times;</button>
    </div>

    <button class="stato-coll" id="collegamento"
            title="Chi è collegato, indirizzo per i colleghi, stato degli invii">
      <span class="spia" id="spia"></span>
      <span class="presenze" id="presenze"></span>
      <span id="collegamento-et">collegato</span>
    </button>

    <button class="io" id="io" title="Cambia operatore"></button>
    <button class="frecc" id="esci" title="Esci dall'archivio online" aria-label="Esci" hidden></button>
    <button class="frecc" id="tema" title="Tema" aria-label="Tema" aria-haspopup="dialog" aria-expanded="false"></button>
  </header>

  <nav class="strumenti" aria-label="Viste, filtri e azioni">
    <!-- VIS-25: sul computer questo involucro non c'e' (display: contents); sul
         telefono e' la striscia che scorre di lato, cosi' la barra resta una riga
         e la linea di stato qui sotto non scorre con lei (css/base.css) -->
    <div class="strumenti-striscia">
    <div class="gruppo" id="viste">
      <button data-vista="anno" aria-pressed="true">Anno</button>
      <button data-vista="mese" aria-pressed="false">Mese</button>
      <button data-vista="stat" aria-pressed="false">Statistiche</button>
    </div>

    <span class="sep"></span>

    <!-- Stato della mappatura: un filtro solo a quattro posizioni, coi numeri
         dentro. I numeri contano l'insieme SENZA il filtro di stato, cosi'
         restano fermi e servono da bottone per tornare indietro.
         #ANCHOR: filtro-stato in js/stato.js -->
    <div class="gruppo stati" id="f-stato" role="group"
         aria-label="Stato della mappatura"
         title="Nella vista Mese la domanda è su QUEL mese; nella vista Anno sulla mappatura dell'anno del sito">
      <button data-stato="" aria-pressed="true"
              title="Tutte, senza filtro di stato">Tutte<i class="n"></i></button>
      <button data-stato="incomplete" aria-pressed="false"
              title="Solo quelle non ancora complete, comprese le in ritardo">Da fare<i class="n"></i></button>
      <button data-stato="ritardo" aria-pressed="false"
              title="Solo quelle con la scadenza già passata e non chiuse">In ritardo<i class="n"></i></button>
      <button data-stato="complete" aria-pressed="false"
              title="Solo quelle già complete">Complete<i class="n"></i></button>
    </div>

    <select class="pill" id="f-prov" aria-label="Filtra per provincia"></select>
    <!-- Chi risponde del sito (PRD-04, #ANCHOR: responsabile in js/stato.js):
         solo online e solo con cloud/11-responsabile.sql applicato -->
    <select class="pill" id="f-resp" aria-label="Filtra per responsabile" hidden></select>
    <button class="pill debole" id="f-chiusi" aria-pressed="false">Mostra chiusi</button>

    <span class="sep"></span>

    <!-- I due generatori di PDF (web/schede/ per i tecnici, web/registro/ per il
         cliente): stessa origine, si aprono in un'altra scheda del browser e
         riconsegnano il PDF al tracker. Il bottone apre la scelta. -->
    <button class="pill" id="documenti" aria-expanded="false"
            title="Genera un PDF dall'Excel: schede tecnici o registro componenti (nuova scheda)">Genera PDF</button>
    <button class="pill" id="azioni" aria-expanded="false">Azioni</button>
    <!-- Solo per chi approva (approvatore o amministratore), e solo se c'e' qualcosa in attesa: le spunte
         di rapportino/ricambi proposte dagli operatori (#ANCHOR: approvazioni in js/app.js) -->
    <button class="pill attesa" id="approva" hidden></button>
    <button class="pill" id="aiuto" title="Come si legge (?)" aria-label="Guida: come si legge">?</button>
    </div>

    <div class="riepilogo" id="riepilogo"></div>

    <!-- La linea di stato: saldata sotto la barra, e' l'avanzamento delle
         mappature dell'anno filtrato. Si vede in ogni vista, sempre. -->
    <div class="filo" id="filo" role="progressbar" aria-valuemin="0" aria-valuemax="100"
         aria-label="Mappature complete dell'anno"><i></i></div>
  </nav>

  <main class="area" id="area" tabindex="-1">
    <div class="vuoto"><b>Caricamento…</b>Lettura di clienti, siti e spunte.</div>
  </main>
</div>

<style>
/* La tessera dell'app (assets/icona.svg) ha il suo fondo: niente piastrina.
   Il logo VRS, con la piastrina al buio, sta nella finestrella del selettore
   (css/vrs-app.css). La freccina non prende l'altezza della tessera. */
.marca img { height: 28px; width: 28px; border-radius: 7px; }
.marca svg.vrs-app-giu { height: 14px; width: 14px; }
.marca { color: inherit; }
/* segnaposto se il file del logo manca */
.segno-logo { width: 26px; height: 26px; border-radius: 7px; display: block;
  background: linear-gradient(90deg,
    var(--st-stampata) 0 23%, transparent 23% 25%,
    var(--marchio) 25% 48%, transparent 48% 50%,
    var(--accento) 50% 73%, transparent 73% 75%,
    var(--st-ricambi) 75% 100%); }
</style>

<script type="module" src="/js/app.js"></script>
</body>
</html>
